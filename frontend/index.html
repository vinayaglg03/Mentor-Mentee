<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMIS | Academic Mentor Intelligence System</title>
  <meta name="description"
    content="Mentee tracking for college faculty: marks, attendance, alerts and mentoring records." />

  <!-- 620 bytes, and the only icon the app actually uses. -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d4ed8" />

  <!--
    Fonts were being pulled by an @import on line 1 of index.css, which is
    both render-blocking and serialised: the browser cannot even discover the
    font request until index.css has downloaded and parsed. Requesting them
    here lets the connection open in parallel with the stylesheet.
    Three weights only (400/500/700) - the previous request asked for ten.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500;700&display=swap" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
