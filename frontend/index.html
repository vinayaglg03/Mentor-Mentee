<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMIS | Academic Mentor Intelligence System</title>
  <meta name="description"
    content="Mentee tracking for college faculty: marks, attendance, alerts and mentoring records." />

  <!-- 620 bytes, and the only icon the app actually uses. -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The landing hero. Discovered here rather than after the bundle has
         parsed and rendered, which is a second and a half later. Both themes
         are listed; the browser fetches the one that matches. -->
    <link rel="preload" as="image" href="/shots/dashboard-light.webp"
          media="(prefers-color-scheme: light)" fetchpriority="high" />
    <link rel="preload" as="image" href="/shots/dashboard-dark.webp"
          media="(prefers-color-scheme: dark)" fetchpriority="high" />
  <meta name="theme-color" content="#1d4ed8" />

  <!--
    Fonts are self-hosted through @fontsource and imported by main.jsx; see
    src/styles/fonts.css for why they are not linked from Google.
  -->

  <!--
    Runs before React, and before the first paint. Without it the page paints
    the light palette, React mounts, and the theme snaps to dark ~200ms later,
    which reads as a broken app rather than a preference.

    localStorage is the mirror, not the source of truth: the server copy is
    fetched after mount and wins. See context/ThemeContext.jsx.
  -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem('amis-theme');
        // 'system' (or nothing stored) leaves the attribute off, so the
        // prefers-color-scheme rules in index.css decide.
        if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);

        var density = localStorage.getItem('amis-density');
        if (density === 'compact') root.setAttribute('data-density', density);

        var motion = localStorage.getItem('amis-motion');
        if (motion === 'reduced' || motion === 'full') root.setAttribute('data-motion', motion);
      } catch (e) {
        /* Private mode with storage blocked: fall through to system defaults. */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
