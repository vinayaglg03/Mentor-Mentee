server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A single-page app: every route that is not a file is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must not be cached, or a stale one keeps serving an
  # old app after an upgrade.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
